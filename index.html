<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Cutting Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme" id="appBody">
<div class="app-container">
    <div id="screenInput" class="screen">
        <div class="app-header">
            <h2>Cutting Master</h2>
            <button class="icon-btn" id="toSettingsBtn">⚙️ Settings</button>
        </div>

        <div class="sub-nav-tabs mode-tabs">
            <button class="sub-tab-btn active" id="barModeBtn">Aluminium Bar</button>
            <button class="sub-tab-btn" id="glassModeBtn">Glass</button>
        </div>

        <div id="barInputMode">
            <div class="card">
                <div class="card-header"><h3>Stock Bars</h3><button id="addStockBtn" class="btn-small">+ Add</button></div>
                <div class="input-row stock-head"><span>Stock Length</span><span>Qty</span><span></span></div>
                <div id="stockContainer"></div>
            </div>
            <div class="card">
                <div class="card-header"><h3>Required Bars</h3><button id="addRequiredBtn" class="btn-small">+ Add</button></div>
                <div class="input-row stock-head"><span>Cut Length</span><span>Qty</span><span></span></div>
                <div id="requiredContainer"></div>
            </div>
            <button id="calculateBtn" class="btn-primary">Calculate Aluminium</button>
        </div>

        <div id="glassInputMode" class="hidden">
            <div class="card">
                <h3>Glass Sheet Size</h3>
                <div class="glass-split-inputs">
                    <input type="text" id="glassSheetWidth" placeholder="Width">
                    <span class="x-separator">×</span>
                    <input type="text" id="glassSheetHeight" placeholder="Height">
                </div>
            </div>
            <div class="card">
                <div class="card-header"><h3>Required Glass</h3><button id="addGlassBtn" class="btn-small">+ Add</button></div>
                <div class="glass-head"><span>Width</span><span>Height</span><span>Qty</span><span></span></div>
                <div id="glassRequiredContainer"></div>
            </div>
            <button id="calculateGlassBtn" class="btn-primary">Calculate Glass</button>
        </div>
    </div>

    <div id="screenSettings" class="screen hidden">
        <div class="app-header"><button class="ios-back-btn" id="backFromSettingsBtn">‹ Back</button><h2>Settings</h2><div style="width:50px"></div></div>
        <div class="card">
            <div class="setting-group"><label>Theme</label><select id="settingTheme"><option value="light">Light</option><option value="dark">Dark</option></select></div>
            <div class="setting-group"><label>Unit</label><select id="settingUnit"><option value="ft-in">Fractional Feet & Inches</option><option value="mm">Millimeters (mm)</option></select></div>
            <div class="setting-group"><label>Kerf / Cutting Gap</label><input type="text" id="settingKerf" class="state-bound-input" data-field="kerf"></div>
        </div>
    </div>

    <div id="screenResult" class="screen hidden">
        <div class="app-header">
            <button class="ios-back-btn" id="backFromResultBtn">‹ Back</button>
            <div class="sub-nav-tabs"><button class="sub-tab-btn active" id="subTabResultBtn">Layout Map</button><button class="sub-tab-btn" id="subTabConfigBtn">Configuration</button></div>
            <button id="editConfigBtn" class="btn-small btn-edit">Edit</button>
        </div>
        <div id="subScreenResult">
            <div class="card" id="summaryView"></div>
            <div class="card zoom-card">
                <div class="zoom-header"><h3 id="layoutTitle">Cutting Layout Map</h3><div class="zoom-controls"><button id="zoomOutBtn" class="btn-zoom">➖</button><button id="zoomInBtn" class="btn-zoom">➕</button><button id="resetZoomBtn" class="btn-reset-map">🔄 Reset</button></div></div>
                <div class="zoom-viewport"><div id="visualLayout" class="zoom-content"></div></div>
                <div class="dpad-container">
                    <div class="dpad-row"><button id="moveUpBtn" class="btn-dpad">▲</button></div>
                    <div class="dpad-row"><button id="moveLeftBtn" class="btn-dpad">◀</button><span class="dpad-center">Move</span><button id="moveRightBtn" class="btn-dpad">▶</button></div>
                    <div class="dpad-row"><button id="moveDownBtn" class="btn-dpad">▼</button></div>
                </div>
            </div>
        </div>
        <div id="subScreenConfig" class="hidden"><div class="card"><h3>Your Input Configuration</h3><div id="readOnlyConfigView"></div></div></div>
    </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
